name: build-exe

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --noconsole --clean --name NumpadReceiver windows/receiver.py
      - uses: actions/upload-artifact@v4
        with:
          name: NumpadReceiver-exe
          path: dist/NumpadReceiver.exe
      - name: Attach to release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NumpadReceiver.exe
